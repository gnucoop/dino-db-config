table:
  name: case
  schema: public
array_relationships:
  - name: case_permissions
    using:
      manual_configuration:
        column_mapping:
          id: metric_id
        insertion_order: null
        remote_table:
          name: case_permissions
          schema: public
  - name: form_data
    using:
      foreign_key_constraint_on:
        column: case_ref_id
        table:
          name: form_data
          schema: public
  - name: report_data
    using:
      foreign_key_constraint_on:
        column: case_ref_id
        table:
          name: report_data
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - id
        - created_at
        - updated_at
        - name
        - parent_id
        - parent_name
        - _deleted
        - _rev
        - _attachments
        - is_deleted
        - code
        - notes
        - metric_data
        - image_file
select_permissions:
  - role: user
    permission:
      columns:
        - _deleted
        - is_deleted
        - created_at
        - code
        - _attachments
        - metric_data
        - image_file
        - name
        - notes
        - parent_name
        - _rev
        - updated_at
        - id
        - parent_id
      filter:
        _or:
          - _exists:
              _table:
                name: case_permissions
                schema: public
              _where:
                _and:
                  - metric_id:
                      _eq: 7044761a-a850-4c37-b6bc-c2d2ca2a3280
                  - user_id:
                      _eq: X-Hasura-User-Id
          - case_permissions:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - _deleted
        - is_deleted
        - created_at
        - code
        - _attachments
        - metric_data
        - image_file
        - name
        - notes
        - parent_name
        - _rev
        - updated_at
        - id
        - parent_id
      filter:
        _or:
          - _exists:
              _table:
                name: case_permissions
                schema: public
              _where:
                _and:
                  - metric_id:
                      _eq: 7044761a-a850-4c37-b6bc-c2d2ca2a3280
                  - user_id:
                      _eq: X-Hasura-User-Id
          - case_permissions:
              user_id:
                _eq: X-Hasura-User-Id
      check: {}
