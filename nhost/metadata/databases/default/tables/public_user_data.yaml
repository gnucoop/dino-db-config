table:
  name: user_data
  schema: public
array_relationships:
  - name: form_data
    using:
      foreign_key_constraint_on:
        column: user_data_ref_id
        table:
          name: form_data
          schema: public
  - name: report_data
    using:
      foreign_key_constraint_on:
        column: user_data_ref_id
        table:
          name: report_data
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - _deleted
        - disabled
        - is_deleted
        - _attachments
        - user_group_ids
        - email
        - full_name
        - _rev
        - created_at
        - updated_at
        - id
        - user_auth_ref_id
select_permissions:
  - role: anonymous
    permission:
      columns:
        - _attachments
        - _deleted
        - _rev
        - created_at
        - disabled
        - email
        - full_name
        - id
        - is_deleted
        - updated_at
        - user_auth_ref_id
        - user_group_ids
      filter:
        full_name:
          _eq: dino_anonymous_user
      limit: 1
  - role: public
    permission:
      columns:
        - _attachments
        - _deleted
        - _rev
        - created_at
        - disabled
        - email
        - full_name
        - id
        - is_deleted
        - updated_at
        - user_auth_ref_id
        - user_group_ids
      filter:
        full_name:
          _eq: dino_anonymous_user
      limit: 1
  - role: user
    permission:
      columns:
        - _attachments
        - _deleted
        - _rev
        - created_at
        - disabled
        - email
        - full_name
        - id
        - is_deleted
        - updated_at
        - user_auth_ref_id
        - user_group_ids
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - _attachments
        - _deleted
        - _rev
        - created_at
        - disabled
        - email
        - full_name
        - id
        - is_deleted
        - updated_at
        - user_auth_ref_id
        - user_group_ids
      filter: {}
      check: {}
