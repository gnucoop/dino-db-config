table:
  name: form_data
  schema: public
object_relationships:
  - name: area
    using:
      foreign_key_constraint_on: area_ref_id
  - name: case
    using:
      foreign_key_constraint_on: case_ref_id
  - name: form_schema
    using:
      foreign_key_constraint_on: form_schema_ref_id
  - name: form_status
    using:
      manual_configuration:
        column_mapping:
          form_status_ref_id: id
        insertion_order: null
        remote_table:
          name: form_status
          schema: public
  - name: location
    using:
      foreign_key_constraint_on: location_ref_id
  - name: organization
    using:
      foreign_key_constraint_on: organization_ref_id
  - name: project
    using:
      foreign_key_constraint_on: project_ref_id
  - name: user_data
    using:
      foreign_key_constraint_on: user_data_ref_id
array_relationships:
  - name: area_permissions
    using:
      manual_configuration:
        column_mapping:
          area_ref_id: metric_id
        insertion_order: null
        remote_table:
          name: area_permissions
          schema: public
  - name: case_permissions
    using:
      manual_configuration:
        column_mapping:
          case_ref_id: metric_id
        insertion_order: null
        remote_table:
          name: case_permissions
          schema: public
  - name: form_permissions
    using:
      manual_configuration:
        column_mapping:
          form_schema_ref_id: form_schema_id
        insertion_order: null
        remote_table:
          name: form_permissions
          schema: public
  - name: location_permissions
    using:
      manual_configuration:
        column_mapping:
          location_ref_id: metric_id
        insertion_order: null
        remote_table:
          name: location_permissions
          schema: public
  - name: logs
    using:
      foreign_key_constraint_on:
        column: form_data_ref_id
        table:
          name: log
          schema: public
  - name: organization_permissions
    using:
      manual_configuration:
        column_mapping:
          organization_ref_id: metric_id
        insertion_order: null
        remote_table:
          name: organization_permissions
          schema: public
  - name: project_permissions
    using:
      manual_configuration:
        column_mapping:
          project_ref_id: metric_id
        insertion_order: null
        remote_table:
          name: project_permissions
          schema: public
insert_permissions:
  - role: anonymous
    permission:
      check:
        form_schema:
          visibility:
            _eq: 1
      columns:
        - _deleted
        - is_deleted
        - created_at
        - _attachments
        - data
        - _rev
        - updated_at
        - area_ref_id
        - case_ref_id
        - form_schema_ref_id
        - form_status_ref_id
        - id
        - location_ref_id
        - organization_ref_id
        - project_ref_id
        - user_data_ref_id
  - role: public
    permission:
      check:
        form_schema:
          visibility:
            _eq: 1
      columns:
        - _deleted
        - is_deleted
        - created_at
        - _attachments
        - data
        - _rev
        - updated_at
        - area_ref_id
        - case_ref_id
        - form_schema_ref_id
        - form_status_ref_id
        - id
        - location_ref_id
        - organization_ref_id
        - project_ref_id
        - user_data_ref_id
  - role: user
    permission:
      check:
        _and:
          - _or:
              - _exists:
                  _table:
                    name: form_permissions
                    schema: public
                  _where:
                    _and:
                      - form_schema_id:
                          _eq: 7044761a-a850-4c37-b6bc-c2d2ca2a3280
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - _or:
                          - form_data_permissions:
                              _contains: create
                          - form_data_permissions:
                              _contains: all
              - form_permissions:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - _or:
                        - form_data_permissions:
                            _contains: create
                        - form_data_permissions:
                            _contains: all
          - _and:
              - _or:
                  - area_ref_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: area_permissions
                        schema: public
                      _where:
                        _and:
                          - metric_id:
                              _eq: 7044761a-a850-4c37-b6bc-c2d2ca2a3280
                          - user_id:
                              _eq: X-Hasura-User-Id
                  - area_permissions:
                      user_id:
                        _eq: X-Hasura-User-Id
              - _or:
                  - case_ref_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: case_permissions
                        schema: public
                      _where:
                        _and:
                          - metric_id:
                              _eq: 7044761a-a850-4c37-b6bc-c2d2ca2a3280
                          - user_id:
                              _eq: X-Hasura-User-Id
                  - case_permissions:
                      user_id:
                        _eq: X-Hasura-User-Id
              - _or:
                  - location_ref_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: location_permissions
                        schema: public
                      _where:
                        _and:
                          - metric_id:
                              _eq: 7044761a-a850-4c37-b6bc-c2d2ca2a3280
                          - user_id:
                              _eq: X-Hasura-User-Id
                  - location_permissions:
                      user_id:
                        _eq: X-Hasura-User-Id
              - _or:
                  - organization_ref_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: organization_permissions
                        schema: public
                      _where:
                        _and:
                          - metric_id:
                              _eq: 7044761a-a850-4c37-b6bc-c2d2ca2a3280
                          - user_id:
                              _eq: X-Hasura-User-Id
                  - organization_permissions:
                      user_id:
                        _eq: X-Hasura-User-Id
              - _or:
                  - project_ref_id:
                      _is_null: true
                  - _exists:
                      _table:
                        name: project_permissions
                        schema: public
                      _where:
                        _and:
                          - metric_id:
                              _eq: 7044761a-a850-4c37-b6bc-c2d2ca2a3280
                          - user_id:
                              _eq: X-Hasura-User-Id
                  - project_permissions:
                      user_id:
                        _eq: X-Hasura-User-Id
      columns:
        - id
        - created_at
        - updated_at
        - user_data_ref_id
        - form_schema_ref_id
        - data
        - area_ref_id
        - location_ref_id
        - organization_ref_id
        - project_ref_id
        - _deleted
        - _rev
        - _attachments
        - is_deleted
        - case_ref_id
        - form_status_ref_id
